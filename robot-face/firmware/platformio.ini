; RF-01 下位机固件
;   编译：   pio run -e esp32dev            （或 -e esp32-s3-devkitc-1）
;   烧录：   pio run -e esp32dev -t upload
;   串口监视：pio device monitor -b 115200
[platformio]
default_envs = esp32dev

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
build_flags = -Wall

[env:esp32dev]
board = esp32dev
build_flags =
    ${env.build_flags}
    -DRF_PIN_SDA=21
    -DRF_PIN_SCL=22

; ESP32-S3-DevKitC-1：用板上标着 “UART” 的那个 USB 口（走 USB 转串口芯片）。
; 如果想用标着 “USB” 的原生口，加上 -DARDUINO_USB_CDC_ON_BOOT=1。
[env:esp32-s3-devkitc-1]
board = esp32-s3-devkitc-1
build_flags =
    ${env.build_flags}
    -DRF_PIN_SDA=8
    -DRF_PIN_SCL=9
